# This pipeline reads a log file from a mounted volume and sends it to Elasticsearch

input {
  file {
    # This path corresponds to the volume mounted in docker-compose.yml
    path => "/var/log/host-data/centralized-log.json"

    # These two settings are key for re-analyzing the same file
    start_position => "beginning"
    # Setting sincedb_path to /dev/null makes Logstash re-read the entire file every time it starts
    sincedb_path => "/dev/null"
  }
}

filter {
  # This assumes your logs are in JSON format.
  # Logstash will parse the JSON string and promote its fields to the top level of the event.
  json {
    source => "message"
  }

  # This filter extracts the timestamp from your log data to be used as the event's primary timestamp.
  # It's crucial for viewing logs in the correct chronological order in Kibana.
  # Make sure the "timestamp" field exists in your JSON logs and is in ISO8601 format (e.g., "2025-07-29T10:30:00.123Z").
  # If your timestamp field has a different name or format, adjust this rule.
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    # This sends the data to the elasticsearch service defined in docker-compose.yml
    hosts => ["http://elasticsearch-portable:9200"]
    # This creates a unique index name for each day's logs
    index => "log-file-analysis-%{+YYYY.MM.dd}"
  }

  # This prints the processed logs to the container's console, which is great for debugging.
  # You can view it by running "docker logs logstash-portable -f"
  stdout {
    codec => rubydebug
  }
}