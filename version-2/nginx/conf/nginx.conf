worker_processes  1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # JSON Log Format for DeltaService
    log_format json_combined escape=json
      '{'
        '"source":"DeltaService",'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
      '}';

    # Single access log (flush removed, NGINX will handle buffering normally)
    access_log  logs/access.log json_combined;
    error_log   logs/error.log warn;

    server {
        listen       8087;
        server_name  localhost;

        # Serve Angular dummy interface
        root   C:/Users/roman/Desktop/projects-cv/centralized-logging-server/version-2/nginx/html;
        index  index.html;

        location / {
            try_files $uri /index.html;
        }

        # Proxy to Alpha
        location /alpha {
            proxy_pass https://localhost:7065;
        }

        # Proxy to Charlie
        location /charlie {
            proxy_pass http://localhost:8082;
        }
    }
}
