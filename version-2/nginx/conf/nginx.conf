worker_processes  1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # --> 1. DEFINE THE ECS-COMPLIANT LOG FORMAT
    # We replace your old `json_combined` format with this new `ecs_json` format.
    # It uses NGINX variables and maps them to the correct ECS fields.
    # The most important part is `"trace": {"id": "$request_id"}`.
    log_format ecs_json escape=json
      '{'
        '"@timestamp": "$time_iso8601",'
        '"ecs": {"version": "8.11.0"},'
        '"service": {"name": "DeltaService-NGINX"},'
        '"trace": {"id": "$request_id"},'
        '"event": {"dataset": "nginx.access"},'
        '"http": {'
          '"request": {'
            '"method": "$request_method",'
            '"bytes": $request_length'
          '},'
          '"response": {'
            '"status_code": $status,'
            '"bytes": $body_bytes_sent'
          '},'
          '"version": "$server_protocol"'
        '},'
        '"url": {'
          '"original": "$scheme://$http_host$request_uri"'
        '},'
        '"client": {'
          '"ip": "$remote_addr"'
        '},'
        '"server": {'
          '"ip": "$server_addr"'
        '},'
        '"user_agent": {'
          '"original": "$http_user_agent"'
        '}'
      '}';

    # --> 2. APPLY THE NEW LOG FORMAT
    # We now tell NGINX to use our new `ecs_json` format for its access log.
    access_log  logs/delta-service-ecs.json ecs_json;
    error_log   logs/error.log warn;

    server {
        listen       8087;
        server_name  localhost;

        root   C:/Users/roman/Desktop/projects-cv/centralized-logging-server/version-2/nginx/html;
        index  index.html;

        location / {
            try_files $uri /index.html;
        }

        # --> CORRECTED LOCATION BLOCK FOR ALPHA
        location /alpha/ { # <-- Added a trailing slash here
            proxy_set_header X-Trace-Id $request_id;

            # This rewrite tells NGINX to strip /alpha/ from the start of the path
            # and pass the rest of the path to the backend.
            proxy_pass https://localhost:7065/; # <-- Added a trailing slash here
        }

        # --> CORRECTED LOCATION BLOCK FOR CHARLIE
        location /charlie/ { # <-- Added a trailing slash here
            proxy_set_header X-Trace-Id $request_id;
            proxy_pass http://localhost:8082/; # <-- Added a trailing slash here
        }
    }

}