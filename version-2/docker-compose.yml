version: "3.8"

services:
    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
        container_name: elasticsearch
        environment:
            - discovery.type=single-node
            - xpack.security.enabled=false
            - ES_JAVA_OPTS=-Xms1g -Xmx1g
        ports:
            - "9200:9200"
        volumes:
            - ./elasticsearch/data:/usr/share/elasticsearch/data

    kibana:
        image: docker.elastic.co/kibana/kibana:8.13.0
        container_name: kibana
        ports:
            - "5601:5601"
        environment:
            ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
            ELASTICSEARCH_USERNAME: "kibana_system"
            ELASTICSEARCH_PASSWORD: ""
            KBN_INTERACTIVE_SETUP_ENABLED: "false"
        depends_on:
            - elasticsearch

    logstash:
        image: docker.elastic.co/logstash/logstash:8.13.0
        container_name: logstash
        ports:
            - "5044:5044"
            - "5000:5000"
            - "9600:9600"
            - "8080:8080"
        volumes:
            # This line mounts your Logstash pipeline configuration. It's correct.
            - ./logstash/pipeline:/usr/share/logstash/pipeline

            # --> THE CHANGES ARE HERE <--
            # We are mapping each Windows log directory to a specific path inside the container.

            # Alpha Logs -> /logs/alpha
            - C:/Users/roman/Desktop/projects-cv/centralized-logging-server/version-2/AlphaService/Logs:/logs/alpha:ro

            # Beta Logs -> /logs/beta
            - C:/Users/roman/Desktop/projects-cv/centralized-logging-server/version-2/BetaService/Logs:/logs/beta:ro

            # Charlie Logs -> /logs/charlie
            - C:/Users/roman/Desktop/projects-cv/centralized-logging-server/version-2/charlie/logs:/logs/charlie:ro

            # Delta (NGINX) Logs -> /logs/delta
            - C:/Users/roman/Desktop/projects-cv/centralized-logging-server/version-2/nginx/logs:/logs/delta:ro

        depends_on:
            - elasticsearch

    filebeat:
        image: docker.elastic.co/beats/filebeat:8.13.0
        container_name: filebeat
        user: root
        command: [ "--strict.perms=false" ]
        volumes:
            - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
            - ./charlie/logs:/logs/charlie:ro
            - ./nginx/logs:/nginx/logs:ro
        depends_on:
            - logstash
        restart: unless-stopped

    heartbeat:
        image: docker.elastic.co/beats/heartbeat:8.13.0
        container_name: heartbeat
        user: root
        command: [ "--strict.perms=false" ]
        volumes:
            - ./heartbeat/heartbeat.yml:/usr/share/heartbeat/heartbeat.yml:ro
        depends_on:
            - elasticsearch
        restart: unless-stopped
