
input {
  # Receives a single JSON object in the body of a POST request.
  http {
    port => 8080
    codec => "json"
  }

  # Receives a stream of data where each line is a complete JSON object.
  tcp {
    port => 5000
    codec => "json_lines"
  }

  # Receives events from Filebeat. Filebeat ensures proper delivery.
  beats {
    port => 5044
  }

  # Reads a file where each line is a complete JSON object.
  file {
    path => "/nginx/logs/access.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_access"
    codec => "json_lines" # <-- Corrected for clarity and best practice
  }
}

filter {
}

filter {
  if [fields][source] == "CharlieService" {
    
    mutate {
      # Copy nested fields to top-level for easy querying
      add_field => {
        "source" => "%{[fields][source]}"
        "traceid" => "%{[contextMap][traceid]}"
        "spanid" => "%{[contextMap][spanid]}"
        "statuscode" => "%{[contextMap][statuscode]}"
        "method" => "%{[contextMap][method]}"
        "requestpath" => "%{[contextMap][url]}"
        "message" => "%{message}"
        "level" => "%{level}"
      }
    }

    mutate {
      remove_field => ["contextMap", "fields", "event", "agent", "log", "host", "ecs"]
    }
  }
}

output {
  stdout { codec => rubydebug }

  file {
    path => "/logs/centralized-log.json"
    codec => json_lines
  }

  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "centralized-logs-%{+YYYY.MM.dd}"
    user => "elastic"
    password => "PtXko=rH1dzKL2OlD_ow"
  }
}
