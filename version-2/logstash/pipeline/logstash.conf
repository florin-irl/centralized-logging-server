# logstash.conf - Reconfigured for Docker volume mounts

input {
  # --- Network Inputs (Kept for research purposes) ---
  http {
    port => 8080
    codec => "json"
    tags => ["input_http"]
  }

  tcp {
    port => 5000
    codec => "json_lines"
    tags => ["input_tcp"]
  }

  beats {
    port => 5044
    tags => ["input_filebeat"]
  }

  # --- File Inputs (Reading from Docker volumes) ---
  
  # 1. AlphaService File Input (from /logs/alpha)
  file {
    path => "/logs/alpha/*.json"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_alpha"
    codec => "json_lines"
    tags => ["service_alpha"]
  }

  # 2. BetaService File Input (from /logs/beta)
  file {
    path => "/logs/beta/*.json"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_beta"
    codec => "json_lines"
    tags => ["service_beta"]
  }

  # 3. CharlieService File Input (from /logs/charlie)
  file {
    path => "/logs/charlie/*.json"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_charlie"
    codec => "json_lines"
    tags => ["service_charlie"]
  }

  # 4. DeltaService (NGINX) File Input (from /logs/delta)
  file {
    path => "/logs/delta/*.json"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_delta"
    codec => "json_lines"
    tags => ["service_delta"]
  }
}

filter {
  # No filtering needed, our logs are pre-formatted ECS.
}

output {
  # For debugging in the Docker container's logs
  stdout { codec => rubydebug }

  # The primary output to the Elasticsearch container
  elasticsearch {
    # This host name 'elasticsearch' works because it's the service name in docker-compose
    hosts => ["http://elasticsearch:9200"] 
    index => "centralized-logs-%{+YYYY.MM.dd}"
    # Your original config had a user/pass, but your docker-compose disables security.
    # We will remove them unless you have re-enabled security.
    # user => "elastic"
    # password => "..." 
  }
}