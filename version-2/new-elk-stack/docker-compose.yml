version: "3.8"

services:
    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
        container_name: new-elasticsearch
        environment:
            # --> SECURITY IS NOW DISABLED <--
            - discovery.type=single-node
            - xpack.security.enabled=false
            - ES_JAVA_OPTS=-Xms512m -Xmx512m
        ports:
            - "9200:9200"
        volumes:
            - elasticsearch-data:/usr/share/elasticsearch/data
    kibana:
        image: docker.elastic.co/kibana/kibana:8.13.0
        container_name: new-kibana
        ports:
            - "5601:5601"
        environment:
            # --> REMOVED all username/password/token variables
            ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
        depends_on:
            - elasticsearch

    logstash:
        image: docker.elastic.co/logstash/logstash:8.13.0
        container_name: new-logstash
        ports:
            - "5044:5044"
            - "5000:5000"
            - "8080:8080"
        volumes:
            - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
            - ./output-logs:/output-logs
        # --> REMOVED the environment block for passwords
        depends_on:
            - elasticsearch

    filebeat:
        image: docker.elastic.co/beats/filebeat:8.13.0
        container_name: new-filebeat
        user: root
        command: [ "--strict.perms=false" ]
        volumes:
            - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
            - C:/Users/roman/Desktop/projects-cv/centralized-logging-server/version-2/AlphaService/Logs:/logs/alpha:ro
            - C:/Users/roman/Desktop/projects-cv/centralized-logging-server/version-2/BetaService/Logs:/logs/beta:ro
            - C:/Users/roman/Desktop/projects-cv/centralized-logging-server/version-2/charlie/logs:/logs/charlie:ro
            - C:/Users/roman/Desktop/projects-cv/centralized-logging-server/version-2/nginx/logs:/logs/delta:ro
        depends_on:
            - logstash

    apm-server:
        image: docker.elastic.co/apm/apm-server:8.13.0
        container_name: new-apm-server
        ports:
            - "8200:8200"
        environment:
            # --> REMOVED all username/password variables
            - output.elasticsearch.hosts=["http://elasticsearch:9200"]
            - apm-server.host="0.0.0.0:8200"
        depends_on:
            - elasticsearch

volumes:
    elasticsearch-data:
